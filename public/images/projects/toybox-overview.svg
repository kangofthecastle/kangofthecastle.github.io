<text x="337" y="867" text-anchor="middle">The original Toybox cat sprite</text>
<text x="80" y="922" fill="#65716b" letter-spacing="2" font-size="17">PYTHON · WINDOWS · LOCAL DATA</text>
<text x="1360" y="922" text-anchor="end" fill="#65716b" font-size="17">Utility illustration</text>
</g>
