<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Toybox: small tools, one desktop companion</title>
<desc id="desc">An illustrated overview with Toybox’s original pixel cat and symbols for system monitoring, clipboard sync, and timers. This is an illustration, not an app screenshot.</desc>
<style>
@media (prefers-reduced-motion: no-preference) {
  .toybox-sprite { animation: cat-idle 1.6s steps(10) infinite; }
}
@keyframes cat-idle { to { transform: translateX(-320px); } }
</style>
<defs><clipPath id="cat-frame"><rect width="32" height="32"/></clipPath></defs>
<rect width="1440" height="960" fill="#d9ded6"/>
<g fill="#263739" font-family="Arial, sans-serif">
<text x="80" y="98" font-size="22" letter-spacing="3">TOYBOX / DESKTOP COMPANIONS</text>
<text x="80" y="195" font-family="Georgia, serif" font-size="86" font-weight="400" letter-spacing="-3">Toybox</text>

</g>
<circle cx="337" cy="583" r="222" fill="#f3f0e8"/>
<ellipse cx="337" cy="752" rx="126" ry="17" fill="#263739" opacity=".18"/>
<g transform="translate(177 418) scale(10)" clip-path="url(#cat-frame)"><image class="toybox-sprite" width="320" height="32" href="data:image/png;base64," style="image-rendering:pixelated"/></g>
<g font-family="Arial, sans-serif" fill="#263739">
<path d="M694 338h666" stroke="#263739" stroke-opacity=".2"/>
<path d="M694 506h666" stroke="#263739" stroke-opacity=".2"/>
<path d="M694 674h666" stroke="#263739" stroke-opacity=".2"/>
<text x="840" y="399" font-size="31" font-weight="400">System HUD</text>
<text x="840" y="439" font-size="23">Metrics, media, and feeds</text>
<text x="840" y="567" font-size="31" font-weight="400">Clipboard</text>
<text x="840" y="607" font-size="23">Recent copies. Local network sync.</text>
<text x="840" y="735" font-size="31" font-weight="400">Desktop cat</text>
<text x="840" y="775" font-size="23">Music, timers, and reminders</text>
</g>
<g stroke="#536966" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round">
<rect x="735" y="373" width="64" height="48" rx="5"/><path d="M758 435h20m-10-14v14m-19-28v-10m15 10v-20m15 20v-14"/>
